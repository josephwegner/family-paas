name: Terraform modules

on:
  pull_request:
    paths:
      - "terraform/modules/**"
      - ".github/workflows/terraform-modules.yml"
  push:
    branches: [main]
    paths:
      - "terraform/modules/**"
      - ".github/workflows/terraform-modules.yml"

jobs:
  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/modules/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  cognito-app-client-terraform-1-5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/modules/cognito-app-client/tests/compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform init -backend=false
      - run: terraform validate

  cognito-app-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/modules/cognito-app-client
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
